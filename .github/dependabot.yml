{
  "version": 2,
  "updates": [
    {
      "package-ecosystem": "pip",
      "directories": [
        "/"
      ],
      "schedule": {
        "interval": "daily"
      },
      "open-pull-requests-limit": 0,
      "groups": {
        "security": {
          "applies-to": "security-updates",
          "patterns": [
            "*"
          ]
        }
      }
    },
    {
      "package-ecosystem": "github-actions",
      "directories": [
        "/"
      ],
      "schedule": {
        "interval": "daily"
      },
      "open-pull-requests-limit": 0,
      "groups": {
        "security": {
          "applies-to": "security-updates",
          "patterns": [
            "*"
          ]
        }
      }
    }
  ]
}
